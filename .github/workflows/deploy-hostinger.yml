name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Bump patch version
        run: |
          npm version patch --no-git-tag-version
          node <<'NODE'
          const fs = require("fs");
          const version = require("./package.json").version;
          const path = "src/lib/site.ts";
          const next = fs.readFileSync(path, "utf8").replace(
            /export const siteVersion = "[^"]+"/,
            `export const siteVersion = "${version}"`,
          );
          if (!next.includes(`export const siteVersion = "${version}"`)) {
            throw new Error("Could not update siteVersion");
          }
          fs.writeFileSync(path, next);
          console.log("siteVersion", version);
          NODE

      - run: npm ci
      - run: npm run build

      - name: Upload out/ to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./out/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: true
          timeout: 600000

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/lib/site.ts
          VERSION=$(node -p "require('./package.json').version")
          git commit -m "chore: bump version to ${VERSION} [skip ci]"
          git pull --rebase origin main
          git push
